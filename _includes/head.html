<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
{% if site.naver_verification != empty %}<meta name="naver-site-verification" content="{{ site.naver_verification | escape }}">{% endif %}
{% if site.google_verification != empty %}<meta name="google-site-verification" content="{{ site.google_verification | escape }}">{% endif %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/wp-block-library.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
