layout: default
permalink: /search/
title: 검색
---
<h1>기사 검색</h1><p id="search-query"></p><div id="search-results" class="card-grid three"></div><script>window.searchIndex = [{% for post in site.posts %}{"title":{{ post.title | jsonify }},"url":{{ post.url | relative_url | jsonify }},"excerpt":{{ post.excerpt | strip_html | jsonify }},"image":{% if post.image != empty %}{{ post.image | relative_url | jsonify }}{% else %}""{% endif %}}{% unless forloop.last %},{% endunless %}{% endfor %}];</script><script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
