name: Sync WordPress and deploy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync.yml', '_data/home-media.json']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wordpress-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize published WordPress posts and images
        run: python scripts/sync_wp.py
      - name: Commit only changed mirror files
        run: |
          git add _posts _data/sync_state.json _data/categories.json _data/home_images.json assets/images category all-news latest-news
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "sync: WordPress posts ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi
  deploy:
    needs: sync
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
