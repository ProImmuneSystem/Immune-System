{% assign card_image = include.image | default: include.post.image %}<article class="post-card">{% if card_image != empty %}<a href="{{ include.post.url | relative_url }}"><img src="{{ card_image | relative_url }}" alt="" loading="lazy"></a>{% endif %}{% if include.post.wp_categories.size > 0 %}<div class="post-category">{{ include.post.wp_categories[0].name }}</div>{% endif %}<h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3><time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: '%Y.%m.%d' }}</time></article>
